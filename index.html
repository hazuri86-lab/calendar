<html lang="ja">
<head>
    <meta charset="UTF-8">

    <title>公共表示用カレンダー</title>

```
<style>
    body {
        margin: 0;
        font-family: sans-serif;
        background: #f5f5f5;
    }

    h1 {
        padding: 20px;
        margin: 0;
        background: white;
        font-size: 22px;
    }

    .info {
        padding: 15px 20px;
        background: #fffde7;
        border-bottom: 1px solid #ddd;
        color: #444;
    }

    .calendar {
        max-width: 1200px;
        margin: 20px auto;
        background: white;
    }

    iframe {
        width: 100%;
        height: 800px;
        border: 0;
    }
</style>
```

</head>

<body>

```
<h1>公共表示用カレンダー</h1>

<div class="info">
    <p>🔄 15分ごとに自動更新　｜　📅 14日先まで確認可能</p>
    <p>📞 通話：だいたい8:00〜18:00　｜　💬 チャット：だいたい7:00〜21:00</p>
    <p>※時間帯は目安です。予定に記載がなくても対応できない場合があります。</p>
</div>

<div class="calendar">
    <iframe
        src="https://calendar.google.com/calendar/embed?src=348cec939d0a0d856f9467b69505460f38659690cead7a42c84c914640109b36%40group.calendar.google.com&ctz=Asia%2FTokyo"
        title="公共表示用カレンダー">
    </iframe>
</div>
```
